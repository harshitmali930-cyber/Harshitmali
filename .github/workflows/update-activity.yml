name: Update GitHub Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest GitHub activity
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          curl -s "https://api.github.com/users/$USERNAME/events/public?per_page=30" \
            -o events.json

          node <<'EOF'
          const fs = require("fs");

          const events = JSON.parse(fs.readFileSync("events.json", "utf8"));

          const push = events.find(e => e.type === "PushEvent");

          let commit = "No recent public commit found";
          let repo = "—";
          let date = "—";
          let url = "";

          if (push) {
            repo = push.repo.name;
            date = new Date(push.created_at).toLocaleString("en-IN", {
              day: "2-digit",
              month: "long",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: true,
              timeZone: "Asia/Kolkata"
            });

            if (push.payload.commits && push.payload.commits.length > 0) {
              commit = push.payload.commits[push.payload.commits.length - 1].message
                .split("\n")[0];
            }

            url = `https://github.com/${repo}/commit/${push.payload.head}`;
          }

          const output = `<!-- ACTIVITY_START -->

          ## 🕐 Latest GitHub Activity

          <table>
          <tr>
          <td>🟢 <b>Last Activity</b></td>
          <td>${date}</td>
          </tr>
          <tr>
          <td>📝 <b>Latest Commit</b></td>
          <td>${commit}</td>
          </tr>
          <tr>
          <td>📂 <b>Repository</b></td>
          <td><a href="https://github.com/${repo}">${repo}</a></td>
          </tr>
          </table>

          🔗 <a href="${url}"><b>View Latest Commit →</b></a>

          <!-- ACTIVITY_END -->`;

          fs.writeFileSync("activity_section.md", output);
          EOF

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text()
          activity = Path("activity_section.md").read_text().strip()

          start = "<!-- ACTIVITY_START -->"
          end = "<!-- ACTIVITY_END -->"

          if start in readme and end in readme:
              before = readme.split(start)[0]
              after = readme.split(end, 1)[1]
              readme = before + activity + after
          else:
              readme += "\n\n" + activity + "\n"

          Path("README.md").write_text(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest GitHub activity"
            git push
          fi
