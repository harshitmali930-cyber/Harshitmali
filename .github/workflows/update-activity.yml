name: Update GitHub Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest public push
        env:
          USERNAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/users/$USERNAME/events/public?per_page=100" \
            -o events.json

      - name: Update activity
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          events = json.loads(Path("events.json").read_text())

          push = next(
              (e for e in events if e.get("type") == "PushEvent"),
              None
          )

          if push:
              repo = push["repo"]["name"]
              date = datetime.fromisoformat(
                  push["created_at"].replace("Z", "+00:00")
              ).astimezone().strftime("%d %B %Y, %I:%M %p")

              commits = push.get("payload", {}).get("commits", [])
              commit = commits[-1]["message"].split("\n")[0] if commits else "Latest push"

              sha = push.get("payload", {}).get("head", "")
              url = f"https://github.com/{repo}/commit/{sha}" if sha else f"https://github.com/{repo}"

              activity = "Public Push / Commit"
          else:
              repo = "No recent public push"
              date = "—"
              commit = "—"
              url = f"https://github.com/{USERNAME}"

              activity = "No recent public push activity"

          output = f"""<!-- ACTIVITY_START -->

          ## 🕐 Latest GitHub Activity

          | | Details |
          |---|---|
          | 🟢 **Activity** | {activity} |
          | 📅 **Date** | {date} |
          | 📂 **Repository** | [{repo}](https://github.com/{repo}) |
          | 📝 **Latest Commit** | {commit} |

          <p align="center">
            <a href="{url}">
              <img src="https://img.shields.io/badge/View%20Latest%20Activity-181717?style=for-the-badge&logo=github" />
            </a>
          </p>

          <!-- ACTIVITY_END -->"""

          readme = Path("README.md").read_text()

          start = "<!-- ACTIVITY_START -->"
          end = "<!-- ACTIVITY_END -->"

          before = readme.split(start)[0]
          after = readme.split(end, 1)[1]

          Path("README.md").write_text(
              before + output + after
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix latest GitHub activity"
            git push
          fi
