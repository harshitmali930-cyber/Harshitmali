name: Update Profile Activity

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity timestamp
        run: |
          echo "Last profile update: $(date -u '+%d %B %Y, %H:%M UTC')" > activity.txt

      - name: Commit activity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.txt
          git diff --cached --quiet || git commit -m "Update profile activity"
          git push
